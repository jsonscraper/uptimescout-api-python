[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
readme = "README.md"
keywords = ["uptimescout", "availability", "status-api", "monitoring", "sdk"]
name = "uptimescout-api"
version = "0.1.3"
description = "UptimeScout API client: regional availability and observation history"
requires-python = ">=3.10"
license = "MIT"

[project.urls]
Homepage = "https://uptimescout.com"
Documentation = "https://github.com/jsonscraper/uptimescout-api-python/blob/main/docs/guide.md"
Repository = "https://github.com/jsonscraper/uptimescout-api-python"
Issues = "https://github.com/jsonscraper/uptimescout-api-python/issues"
